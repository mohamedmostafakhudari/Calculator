<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="utils.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main>
    <div id="calculator-body" class="calculator-body">
      <div class="display">
        <p class="display-content">0</p>
      </div>
      <div class="buttons">
        <button class="btn" data-type="digit" data-value="1">1</button>
        <button class="btn" data-type="digit" data-value="2">2</button>
        <button class="btn" data-type="digit" data-value="3">3</button>
        <button class="btn" data-type="operator" data-value="+">+</button>
        <button class="btn" data-type="digit" data-value="4">4</button>
        <button class="btn" data-type="digit" data-value="5">5</button>
        <button class="btn" data-type="digit" data-value="6">6</button>
        <button class="btn" data-type="operator" data-value="-">-</button>
        <button class="btn" data-type="digit" data-value="7">7</button>
        <button class="btn" data-type="digit" data-value="8">8</button>
        <button class="btn" data-type="digit" data-value="9">9</button>
        <button class="btn" data-type="operator" data-value="*">x</button>
        <button class="btn" data-type="digit" data-value="0">0</button>
        <button class="btn" data-type="separator" data-value=".">.</button>
        <button class="btn" data-type="operator" data-value="=">=</button>
        <button class="btn" data-type="operator" data-value="/">/</button>
        <button class="btn" data-type="function" data-value="clear">Clear</button>
        <button class="btn" data-type="function" data-value="undo">Undo</button>
      </div>
    </div>
    <div class="keyboard-controls-info caveat-400">
      <h3>Keyboard</h3>
      <div class="wrapper">
        <p>digits: <span>0 to 9</span></p>
        <p>decimal point: <span>.</span></p>
        <p>add: <span>+</span></p>
        <p>subtract: <span>-</span></p>
        <p>multiply: <span>*</span></p>
        <p>divide: <span>/</span></p>
        <p>calculate: <span>= or Enter key</span></p>
        <p>clear: <span>Delete key</span></p>
        <p>undo: <span>Backspace key</span></p>
      </div>
    </div>
  </main>
</body>
</html>
